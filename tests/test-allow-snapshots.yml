name: Test allow-snapshots input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run wrapper validation with allow-snapshots=true
        id: action
        uses: .
        continue-on-error: true
        with:
          min-wrapper-count: '1'
          allow-snapshots: 'true'
          # Allow the empty invalid wrapper jar checksum
          allow-checksums: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
      - name: Assert action ran with allow-snapshots=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED_WRAPPER: ${{ steps.action.outputs.failed-wrapper }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed-wrapper: $FAILED_WRAPPER"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with allow-snapshots=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to other wrappers)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
