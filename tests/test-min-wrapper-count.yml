name: Test min-wrapper-count input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run wrapper validation with min-wrapper-count=0
        id: action-zero
        uses: .
        continue-on-error: true
        with:
          min-wrapper-count: '0'
          allow-snapshots: 'false'
          # Allow the empty invalid wrapper jar checksum
          allow-checksums: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
      - name: Assert action ran with min-wrapper-count=0
        env:
          OUTCOME: ${{ steps.action-zero.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with min-wrapper-count=0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to other wrappers)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Run wrapper validation with min-wrapper-count=100 (expect failure)
        id: action-high
        uses: .
        continue-on-error: true
        with:
          min-wrapper-count: '100'
          allow-snapshots: 'false'
          allow-checksums: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
      - name: Assert action fails with high min-wrapper-count
        env:
          OUTCOME: ${{ steps.action-high.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when min-wrapper-count=100 not met"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded unexpectedly (repo has 100+ wrapper JARs?)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
